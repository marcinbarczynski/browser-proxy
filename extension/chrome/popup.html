<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Browser Proxy</title>
  <style>
    body {
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      width: 280px;
      padding: 12px 14px;
      color: #1a1a1a;
    }
    h1 { font-size: 14px; margin: 0 0 6px 0; }
    p { margin: 6px 0; line-height: 1.4; }
    button {
      width: 100%;
      padding: 6px 10px;
      margin-top: 8px;
      font: inherit;
      cursor: pointer;
    }
    .status { padding: 6px 8px; border-radius: 4px; margin: 8px 0; }
    .ok { background: #e7f5e7; color: #1a5f1a; }
    .err { background: #fde7e7; color: #6f1a1a; }
    code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Browser Proxy</h1>
  <p>Top-level navigations in this browser are forwarded to the
     <code>browser-proxy</code> daemon for routing.</p>
  <div id="status" class="status">Checking native host…</div>
  <button id="ping">Test connection</button>
  <script src="popup.js"></script>
</body>
</html>
